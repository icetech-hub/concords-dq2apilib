
syntax = "proto3";

package omk;

option go_package = "./pt";

// 定義一筆市場資料的結構
message Tbl {
    string symbol = 1;
    int64 datetime = 2;
    double lastprice = 3;
    int64 volume = 4;
    int64 totalvolume = 5;
    double bidprice1 = 6;
    double askprice1 = 7;
    int64 oi = 8;
}

// 定義一筆市場資料的結構
message Omk {
    string symbol = 1;
    // GMT+8 (YYYYMMDDHHMMSSmmm)
    int64 datetime = 2; 
    double openprice = 3;
    double highestprice = 4;
    double lowestprice = 5;
    double closeprice = 6;
    int64 volume = 7;
    int64 amount = 8;
    int64 oi = 9;
    string json_b = 10;
    int64 totalvolume = 11;
    int64 totalamount = 12;
    bool half = 13;
    double predividendadj = 14;
    double postdividendadj = 15;
}

// 分價表
message PV {
    double price = 1;
    int64 volume = 2;
}

// CQYZ
message CQYZ {
    string symbol = 1;
    int64 date = 2;
    double stockorcachedividend = 3;
    double stockandcachedividend = 4;
    double beforeprice = 5;
    double afterprice = 6;
    double adjustmentfactor = 7;
}

message HDData {
    reserved 5, 6, 7, 8, 9, 10; // 預留這些編號
    // 狀態代碼
    int32 code = 1;
    // 文字訊息，可以為空
    string msg = 2;
    // 類型，必須為[服務].[功能]，例如：hd.omk
    string type = 3;
    // 識別id
    string recognize = 4;
    // 分K或日K的array結構
    repeated Omk omks = 11;
    // Tbl的array結構
    repeated Tbl tbls = 12;
    // 分價表
    repeated PV pvs = 13;
    // CQYZ
    repeated CQYZ cqyzs = 14;
}

