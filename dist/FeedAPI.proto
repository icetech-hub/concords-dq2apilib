// Feed API server protocol v1.0.17

syntax = "proto2";

package FeedAPI;

// Last changes were made on 14 Dec 2025
enum Version
{
  VERSION_VALUE = 1000017;
}

// ----------------------------------------------------------------------
// 4.1 MainMsg (主封包)
message MainMsg
{
  // 4.2 Logon (登入)
  optional Logon Logon = 1;

  // 4.3 LogonReply (登入回應)
  optional LogonReply LogonReply = 2;

  // 4.4 AdapterStatus (Adapter狀態)
  optional AdapterStatus AdapterStatus = 3;

  // 4.5 Command (指令資訊)
  optional Command Command = 4;

  // 4.6 CommandReply (指令回應)
  optional CommandReply CommandReply = 5;

  // 4.7 SymbolMap (品種對應表資訊)
  repeated SymbolMap SymbolMaps = 6;

  // 4.8 ContractList (合約資訊)
  repeated ContractList ContractLists = 7;

  // 4.9 Realtime (即時行情)
  repeated Realtime Realtimes = 8;

  // 4.10 Heartbeat (心跳訊息)
  optional Heartbeat Heartbeat = 9;

  // 4.11 SymbolList (品種資訊)
  repeated SymbolList SymbolLists = 10;

  // 4.12 Continued (接續旗號)
  optional bool Continued = 11;

  // 4.13 RealGreeks (即時Greeks)
  repeated RealGreek RealGreeks = 12;
}


// ----------------------------------------------------------------------
// 4.2 Logon (登入)
message Logon
{
  // 登入系統名稱
  required string System = 1;

  // 登入密碼
  required string Password = 2;

  // 來源行情代碼
  required string Source = 3;

  // 版本號 VERSION_VALUE
  required uint32 ProtocolVersion = 4;
}


// ----------------------------------------------------------------------
// 4.3 LogonReply (登入回應)
message LogonReply
{
  // 回傳登入結果
  required string Result = 1;

  // 失敗原因說明
  optional string Description = 2;
}


// ----------------------------------------------------------------------
// 4.4 AdapterStatus (Adapter狀態)
message AdapterStatus
{
  // 回傳登入結果
  required string Status = 1;

  // 失敗原因說明
  optional string Description = 2;
}


// ----------------------------------------------------------------------
// 4.5 Command (指令資訊)
message Command
{
  // 回傳登入結果
  required string Cmd = 1;

  // 失敗原因說明
  repeated string Parameters = 2;
}


// ----------------------------------------------------------------------
// 4.6 CommandReply (指令回應)
message CommandReply
{
  // 回傳原指令識別
  required string Cmd = 1;

  // 回傳延伸參數
  repeated string Parameters = 2;

  // 回傳指令結果
  required string Result = 3;

  // 失敗原因說明
  optional string Description = 4;
}


// ----------------------------------------------------------------------
// 4.7 SymbolMap (品種對應表資訊)
message SymbolMap
{
  // DQ2 品種代碼 (Type.Exchange.Symbol)
  required string DQ2Code = 1;

  // 來源交易所
  required string Exchange = 2;

  // 來源品種
  required string Symbol = 3;

  // 來源價格要乘上的乘數
  required double Multiplier = 4 [default=1];

  // DQ2 延伸代碼 
  optional string DQ2Extra = 5;
}


// ----------------------------------------------------------------------
// 4.8 ContractList (合約資訊)
enum MktCate
{
  // TWSE 交易所
  MC_TWS_TSE = 1;  // 上市
  MC_TWS_OTC = 2;  // 上櫃
}
enum SymbCate
{
  // TWSE 交易所
  SC_TWS_INDEX = 0;        // 指數	
  SC_TWS_STOCK = 1;        // 股票
  SC_TWS_WARRRANT = 2;     // 權證
  SC_TWS_ETF = 3;      	   // ETF
  SC_TWS_BOND_COMP = 4;    // 公司債
  SC_TWS_BOND_DEPO = 5;    // 存託公司債
  SC_TWS_BOND_CENT = 6;    // 中央登錄公債
  SC_TWS_BOND_FOREIGN = 7; // 外國債券

}
enum WarrStat
{
  // TWSE 交易所
  WS_TWS_00 = 0;   // 正常
  WS_TWS_01 = 1;   // 注意
  WS_TWS_02 = 2;   // 處置
  WS_TWS_03 = 3;   // 注意及處置
  WS_TWS_04 = 4;   // 再次處置
  WS_TWS_05 = 5;   // 注意及再次處置
  WS_TWS_06 = 6;   // 彈性處置
  WS_TWS_07 = 7;   // 注意及彈性處置
}
message ContractList 
{
  // 商品代碼 (Type.Exchange.Commodity.Month)
  required string SymbCode = 1;

  // 商品名稱 (UTF-8)
  required string Name = 2;

  // 合約建立日期 YYYYMMDD
  optional uint32 CreateDate = 3;

  // 結算日期 YYYYMMDD
  optional uint32 SettlementDate = 4;

  // 市場最後交易日 YYYYMMDD
  optional uint32 ExpireDate = 5;

  // 最後可交易日期 YYYYMMDD
  optional uint32 LastTradingday = 6;

  // 交易所下單代碼
  optional string ExchOrderSymbol = 7;

  // 股數 (股票 張=股數)
  optional uint32 BoardLot = 8;

  // 市場別
  optional MktCate MarketCategory = 9;

  // 商品類別
  optional SymbCate SymbolCategory = 10;

  // 警示類別
  optional WarrStat WarrningState = 11;

  // 交割日期 YYYYMMDD
  optional uint32 ContractDate = 12;

}


// ----------------------------------------------------------------------
// 4.9 Realtime (即時行情)
message Realtime
{
  // 表示是否為快照行情
  optional bool Snapshot = 1 [default=false];

  // 商品代碼
  optional string SymbCode = 2;

  // 傳送代碼
  optional string SendCode = 3;

  // GMT+8 成交日期 (YYYYMMDD)
  optional uint32 Date = 4;

  // GMT+8 時間 (HHMMSSmmmuuunnnppp, mmm=milli-second, uuu=micro-second ; nnn=nano ; ppp=pico)
  optional uint64 Time = 5;

  // 市場資訊
  optional Market Market = 6;

  // 成交資料
  optional Deal Deal = 7;

  // 委託簿
  optional DOM DOM = 8;
}


// ----------------------------------------------------------------------
// 4.9.1 Market (市場資訊)
enum TsState // 盤別狀態碼
{
  TSSTATE_CLEAR = 2;	// 清盤
  TSSTATE_OPEN = 3;	// 開盤
  TSSTATE_CLOSE = 4;	// 收盤
  TSSTATE_PREOPEN = 5;	// 試撮
  TSSTATE_SUSPEND = 6;	// 暫停
  TSSTATE_REMOVE = 7;	// 刪除
}
enum TrStatus // 交易狀態
{
  TRSTATUS_REGULAR_TRADING = 0;		// 正常交易
  TRSTATUS_IEP = 1;			// 試撮
  TRSTATUS_PAUSE = 2;			// 暫停
  TRSTATUS_NON_CANCELLABLE_ORDER = 3;	// 禁刪
  TRSTATUS_CLOSE = 4;			// 收盤
  TRSTATUS_CALL_AUCTION = 5;		// 集合競價
  TRSTATUS_CIRCUIT_BREAKER_RT = 6;	// 熔斷(可恢復交易)
  TRSTATUS_CIRCUIT_BREAKER_NRT = 7;	// 熔斷(不可恢復交易)
  TRSTATUS_TRADING_HALT = 8;		// 停牌
  TRSTATUS_NON_TRADING = 9;		// 非交易
  TRSTATUS_VOLATILITY_INTERRUPT = 10;	// 波動性中斷
  TRSTATUS_UNDEFINED = 11;		// 無狀態
  TRSTATUS_PREOPEN = 12;		// 開盤前
  TRSTATUS_POST_TRADING = 13;		// 盤後交易
  TRSTATUS_MARKET_CLOSED = 14;		// 休市

  // TAIFEX PAUSE BitMask 256(0x100) ------------
  TRSTATUS_TAIFEX_PAUSE_001 = 257;	// bit0=1 因應特殊市況
  TRSTATUS_TAIFEX_PAUSE_010 = 258;	// bit1=1 動態價格穩定措施資訊異常
  TRSTATUS_TAIFEX_PAUSE_011 = 259;
  TRSTATUS_TAIFEX_PAUSE_100 = 260;	// bit2=1 因資訊異常基準價無法計算
  TRSTATUS_TAIFEX_PAUSE_101 = 261;
  TRSTATUS_TAIFEX_PAUSE_110 = 262;
  TRSTATUS_TAIFEX_PAUSE_111 = 263;
}
enum SessKind // 盤別分類
{
  SESSKIND_REGULAR = 0;			// 一般盤 (T盤 / 日盤)
  SESSKIND_AFTER_HOURS = 1;		// 盤後盤 (T+1盤 / 夜盤)
}
message Market
{
  // 盤別狀態碼
  optional TsState TradeSession = 1;

  // 漲停價
  optional double UpperLimitPrice = 2;

  // 跌停價
  optional double LowerLimitPrice = 3;

  // 參考價
  optional double ReferencePrice = 4;

  // 結算價
  optional double SettlementPrice = 5;

  // 收盤價
  optional double ClosePrice = 6;

  // 昨收盤價
  optional double PreClosePrice = 7;

  // 昨成交總量
  optional uint64 PreTotalVolume = 8;

  // 交易狀態
  optional TrStatus TradeStatus = 9;

  // 邏輯交易日
  optional uint32 TradingDay = 10;

  // 盤別分類
  optional SessKind SessionKind = 11;

  // AfterHour(T+1盤) 開盤價
  optional double AHOpenPrice = 12;

  // AfterHour(T+1盤) 最高價
  optional double AHHighestPrice = 13;

  // AfterHour(T+1盤) 最低價
  optional double AHLowestPrice = 14;

  // AfterHour(T+1盤) 收盤價
  optional double AHClosePrice = 15;

  // AfterHour(T+1盤) 成交總量
  optional uint64 AHTotalVolume = 16;
}


// ----------------------------------------------------------------------
// 4.9.2 Deal (成交資料)
message Deal
{
  // 表示清除
  optional bool IsClear = 1 [default=false];

  // 成交價格
  optional double LastPrice = 2;

  // 成交單量
  optional uint32 Volume = 3;

  // 成交總量
  optional uint64 TotalVolume = 4;

  // 成交金額
  optional double Amount = 5;

  // 總成交金額
  optional double TotalAmount = 6;

  // 當盤開盤價
  optional double OpenPrice = 7;

  // 當盤最高價
  optional double HighestPrice = 8;

  // 當盤最低價
  optional double LowestPrice = 9;

  // 買價 
  optional double BidPrice = 10;

  // 買量
  optional uint32 BidVolume = 11;

  // 賣價
  optional double AskPrice = 12;

  // 賣量
  optional uint32 AskVolume = 13;

  // 未平倉量
  optional uint32 OpenInterest = 14;
}


// ----------------------------------------------------------------------
// 4.9.3 DOM (委託簿)
message DOM
{
  // 買價 
  repeated double BidPrices = 1 [packed=true];

  // 買量
  repeated uint32 BidVolumes = 2 [packed=true];

  // 賣價
  repeated double AskPrices = 3 [packed=true];

  // 賣量
  repeated uint32 AskVolumes = 4 [packed=true];
}


// ----------------------------------------------------------------------
// 4.10 Heartbeat (心跳訊息)
message Heartbeat
{
  // GMT+8 日期 (YYYYMMDD)
  required uint32 Date = 1;

  // GMT+8 時間 (HHMMSSmmmuuunnnppp, mmm=milli-second, uuu=micro-second ; nnn=nano ; ppp=pico)
  required uint64 Time = 2;
}


// ----------------------------------------------------------------------
// 4.11 SymbolList (品種資訊)
enum TrgCate
{
  TC_INDEX = 1;		// 指數
  TC_STOCK = 2;		// 個股
  TC_COMMODITY = 3;	// 商品
  TC_BOND = 4;		// 債券
  TC_CURRENCY = 5;	// 貨幣
  TC_INTEREST_RATE = 6;	// 利率
}
message SymbolList 
{
  // 交易所
  required string Exchange = 1;

  // 品種代碼
  required string Symbol = 2;

  // 品種名稱 (UTF-8)
  required string Name = 3;

  // 類別“F”表示期貨,“O”選擇權
  required string Category = 4;

  // 契約乘數
  required double ContractSize = 5;

  // 幣別
  required string Currency = 6;

  // 標的物
  required string Target = 7;

  // 標的物類別
  optional TrgCate TargetCategory = 8;
}


// ----------------------------------------------------------------------
// 4.13 RealGreek (即時Greeks)
message RealGreek
{  
  // 商品代碼
  optional string SymbCode = 1;

  // GMT+8 成交日期 (YYYYMMDD)
  optional uint32 Date = 2;

  // GMT+8 時間 (HHMMSSmmmuuunnnppp, mmm=milli-second, uuu=micro-second ; nnn=nano ; ppp=pico)
  optional uint64 Time = 3;

  // Level 1 Greeks
  optional GreeksL1 GreeksL1 = 4;

  // Level 2 Greeks
  optional GreeksL2 GreeksL2 = 5;

  // Level 3 Greeks
  optional GreeksL3 GreeksL3 = 6;
  
  // Level 4 Greeks
  optional GreeksL4 GreeksL4 = 7;

}

// ----------------------------------------------------------------------
// 4.13.1 GreeksL1 (Level 1 Greeks)
message GreeksL1
{
  optional float OTMIV = 1;
  optional float MIV = 2;
  optional float TV = 3;
  optional float TheoryPrice = 4;
  optional float Delta = 5;
  optional float Gamma = 6;
  optional float Vega = 7;
  optional float Theta = 8;
  optional float Rho = 9;
  optional float HV_4w = 10;
  optional float YOTMIV = 11;
}

// ----------------------------------------------------------------------
// 4.13.2 GreeksL2 (Level 2 Greeks)
message GreeksL2
{
  optional float Charm = 1;
  optional float Vanna = 2;
  optional float Vomma = 3;
  optional float Speed = 4;
  optional float Zomma = 5;
  optional float CallPutSkew = 6;
  optional float CallSkew = 7;
  optional float PutSkew = 8;
  optional float NearAtmIV = 9;
  optional float BidIV = 10;
  optional float AskIV = 11;
}

// ----------------------------------------------------------------------
// 4.13.3 GreeksL3 (Level 3 Greeks)
message GreeksL3
{
  optional float Call10DeltaIV = 1;
  optional float Put10DeltaIV = 2;
  optional float Call25DeltaIV = 3;
  optional float Put25DeltaIV = 4;
  optional float Call10DeltaTV = 5;
  optional float Put10DeltaTV = 6;
  optional float Call25DeltaTV = 7;
  optional float Put25DeltaTV = 8;
  optional float CallNear10DeltaIV = 9;
  optional float PutNear10DeltaIV = 10;
  optional float CallNear25DeltaIV = 11;
  optional float PutNear25DeltaIV = 12;
  optional float CallTailRisk = 13;
  optional float PutTailRisk = 14;
  optional float CallResidualTailRisk = 15;
  optional float PutResidualTailRisk = 16;
}

// ----------------------------------------------------------------------
// 4.13.4 GreeksL4 (Level 4 Greeks)
message GreeksL4
{
  optional float StraddleAtmPremium = 1;
  optional float StraddleAtmWeight = 2;
  optional float StraddleCall10DeltaMid = 3;
  optional float StraddleCall25DeltaMid = 4;
  optional float StraddlePut10DeltaMid = 5;
  optional float StraddlePut25DeltaMid = 6;
}